name: "Build and publish Nuget package"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  NETCORE_VERSION: '10.0.x'
  # Credentials for the bigbadjock-github source in nuget.config (REST-Parser is only published there)
  GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
  GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET ${{ env.NETCORE_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.NETCORE_VERSION }}

    - name: Restore
      run: dotnet restore ./SilverCodeAPI.sln

    - name: Build
      run: dotnet build ./SilverCodeAPI.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test --solution ./SilverCodeAPI.sln --configuration Release --no-build

    - name: Pack
      run: dotnet pack ./SilverCodeAPI.sln --configuration Release -o finalpackage --no-build

    - name: Publish
      uses: actions/upload-artifact@v4
      with:
        name: SilverCodeAPI
        path: finalpackage

    - name: Push Nupkg to GitHub Packages
      if: github.event_name == 'push'
      uses: tanaka-takayoshi/nuget-publish-to-github-packages-action@v2.1
      with:
        nupkg-path: './finalpackage/*.nupkg'
        repo-owner: bigbadjock
        gh-user: bigbadjock
        token: ${{ secrets.GITHUB_TOKEN }}
